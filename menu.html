<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link rel="stylesheet" href="menu.css">
    <link href="https://googleapis.com" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <aside class="sidebar">
        <form class="sidebar__form">
            <input type="checkbox" id="open-menu">
            <label for="open-menu" class="material-symbols-outlined">close</label>
        </form>
        <picture class="sidebar__picture">
            <img src="assets/p3logo.webp">
        </picture>
        <nav class="sidebar__nav">
            <ul>
                <li class="sidebar__item">
                <span class="material-symbols-outlined">notifications</span>
                <a href="#">Notification</a>
            </li>
            <li class="sidebar__item">
                <span class="material-symbols-outlined">Mail</span>
                <a href="#">Mail</a>
            </li>
            <li class="sidebar__item">
                <span class="material-symbols-outlined">Shopping_cart</span>
                <a href="#">Shopping Cart</a>
            </li>
            <li class="sidebar__item">
                <span class="material-symbols-outlined">account_balance</span>
                <a href="#">Account Balance</a>
            </li>
            <li class="sidebar__item">
                <span class="material-symbols-outlined">Settings</span>
                <a href="#">Settings</a>
            </li>
            </ul>
        </nav>
        <div class="sidebar__profile">
            <ul>
                <li class="sidebar__item item--profile">
                    <img src="https://i.redd.it/q2meqzyvet3e1.jpg">
                    <span class="profile__option">Profile</span>
                </li>
                <li class="sidebar__item">
                    <span class="material-symbols-outlined">logout</span>
                    <a href="#">Logout</a>
                </li>
            </ul>
        </div>
    </aside>
</body>
</html>
